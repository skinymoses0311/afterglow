# nginx site config for afterglowcredit.online
# Install to /etc/nginx/sites-available/afterglow and symlink into sites-enabled.
#
# This is the pre-TLS version. Running `certbot --nginx -d afterglowcredit.online
# -d www.afterglowcredit.online` rewrites it in place to add the 443 server block
# and the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;

    server_name afterglowcredit.online www.afterglowcredit.online;

    root /var/www/afterglow/current;
    index index.html;

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The HTML shell must never be cached, or deploys won't take effect.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /favicon.ico {
        expires 30d;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 2m;
}
