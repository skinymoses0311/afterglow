# nginx site config for afterglowcredit.online
#
# Install:
#   sudo cp deploy/security-headers.conf /etc/nginx/snippets/afterglow-headers.conf
#   sudo cp deploy/nginx.conf            /etc/nginx/sites-available/afterglow
#   sudo ln -sfn /etc/nginx/sites-available/afterglow /etc/nginx/sites-enabled/afterglow
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is the pre-TLS version. Running
#   sudo certbot --nginx -d afterglowcredit.online -d www.afterglowcredit.online --redirect
# rewrites it in place, adding the 443 listeners, the certificate paths and a
# second server block that redirects HTTP to HTTPS. The live file on the VPS is
# the post-certbot version; this is kept as the reproducible starting point.

server {
    listen 80;
    listen [::]:80;

    server_name afterglowcredit.online www.afterglowcredit.online;

    root /var/www/afterglow/current;
    index index.html;

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    # Note the snippet is re-included in every location that sets a header of its
    # own — see security-headers.conf for why that is required.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/afterglow-headers.conf;
        access_log off;
    }

    # The HTML shell must never be cached, or deploys won't take effect.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include snippets/afterglow-headers.conf;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/afterglow-headers.conf;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
    }

    include snippets/afterglow-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 2m;
}
