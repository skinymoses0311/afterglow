# nginx site config for AfterGlow, after the move to afterglowcredit.com.
#
# Canonical host is the apex, afterglowcredit.com. Everything else — www, and
# both .online hostnames — 301s to it, so there is exactly one indexable origin
# and link equity is not split four ways.
#
# .online is deliberately kept serving over HTTPS rather than switched off: it
# was issued an HSTS header with a one-year max-age, so browsers that have seen
# it will refuse plain HTTP there until 2027. It needs a valid certificate for
# the redirect to be reachable at all.
#
# Installed by deploy/deploy.sh on every deploy, because this and the build
# depend on each other: it serves the pre-rendered pages as files and answers
# anything else with a 404. Needs both brotli modules:
#   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static

# ---------------------------------------------------------------- canonical
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name afterglowcredit.com;

    ssl_certificate /etc/letsencrypt/live/afterglowcredit.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afterglowcredit.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/afterglow/current;

    # Every page is a pre-rendered file: /merchants is merchants/index.html
    # (scripts/prerender.mjs). A path with no file gets a real 404, instead of
    # the homepage with a 200, which search engines count as a duplicate page.
    location / {
        try_files $uri $uri/index.html =404;
        # Checked with the server on every load, so a deploy shows on the very
        # next visit, but an unchanged page comes back as an empty 304 instead
        # of being downloaded again. Never cached for a fixed time: the URL
        # stays the same when the content changes.
        add_header Cache-Control "no-cache" always;
        include snippets/afterglow-headers.conf;
    }

    # One address per page: /merchants/ and /merchants/index.html redirect to
    # /merchants, and /index.html to /.
    location ~ ^(?<page>/.+?)/(?:index\.html)?$ {
        return 301 $page$is_args$args;
    }
    location = /index.html {
        return 301 /$is_args$args;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include snippets/afterglow-headers.conf;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    # The headers snippet is re-included in every location that sets a header of
    # its own — see security-headers.conf for why that is required.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/afterglow-headers.conf;
        access_log off;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/afterglow-headers.conf;
        access_log off;
    }

    location = /apple-touch-icon.png {
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/afterglow-headers.conf;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
    }

    include snippets/afterglow-headers.conf;

    # Compressed once at build time, at maximum settings (scripts/precompress.mjs),
    # and sent as-is to browsers that accept it. The on-the-fly settings below
    # only cover anything without a pre-compressed copy.
    brotli_static on;
    gzip_static on;

    # text/html is always compressed; these are the other types worth it.
    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml image/x-icon;

    # Brotli for the browsers that ask for it, which is nearly all of them.
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml image/x-icon;

    client_max_body_size 2m;
}

# ------------------------------------------------- every other host redirects
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.afterglowcredit.com afterglowcredit.online www.afterglowcredit.online;

    ssl_certificate /etc/letsencrypt/live/afterglowcredit.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afterglowcredit.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Path-preserving, so /waitlist on the old domain lands on /waitlist here.
    return 301 https://afterglowcredit.com$request_uri;
}

# ------------------------------------------------------------- http upgrades
server {
    listen 80;
    listen [::]:80;
    server_name afterglowcredit.com www.afterglowcredit.com
                afterglowcredit.online www.afterglowcredit.online;

    # Let ACME renewals answer over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://afterglowcredit.com$request_uri;
    }
}
