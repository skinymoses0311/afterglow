# nginx site config for AfterGlow, after the move to afterglowcredit.com.
#
# Canonical host is the apex, afterglowcredit.com. Everything else — www, and
# both .online hostnames — 301s to it, so there is exactly one indexable origin
# and link equity is not split four ways.
#
# .online is deliberately kept serving over HTTPS rather than switched off: it
# was issued an HSTS header with a one-year max-age, so browsers that have seen
# it will refuse plain HTTP there until 2027. It needs a valid certificate for
# the redirect to be reachable at all.

# ---------------------------------------------------------------- canonical
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name afterglowcredit.com;

    ssl_certificate /etc/letsencrypt/live/afterglowcredit.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afterglowcredit.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/afterglow/current;
    index index.html;

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    # The headers snippet is re-included in every location that sets a header of
    # its own — see security-headers.conf for why that is required.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/afterglow-headers.conf;
        access_log off;
    }

    # The HTML shell must never be cached, or deploys won't take effect.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include snippets/afterglow-headers.conf;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/afterglow-headers.conf;
        access_log off;
    }

    location = /apple-touch-icon.png {
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/afterglow-headers.conf;
        access_log off;
    }

    location = /robots.txt {
        access_log off;
    }

    include snippets/afterglow-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 2m;
}

# ------------------------------------------------- every other host redirects
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.afterglowcredit.com afterglowcredit.online www.afterglowcredit.online;

    ssl_certificate /etc/letsencrypt/live/afterglowcredit.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afterglowcredit.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Path-preserving, so /waitlist on the old domain lands on /waitlist here.
    return 301 https://afterglowcredit.com$request_uri;
}

# ------------------------------------------------------------- http upgrades
server {
    listen 80;
    listen [::]:80;
    server_name afterglowcredit.com www.afterglowcredit.com
                afterglowcredit.online www.afterglowcredit.online;

    # Let ACME renewals answer over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://afterglowcredit.com$request_uri;
    }
}
