# Shared response headers for afterglowcredit.online.
# Install to /etc/nginx/snippets/afterglow-headers.conf
#
# This exists as a snippet because nginx's add_header does NOT merge across
# levels: a single add_header inside a location block discards every add_header
# inherited from the server block. Since `/` internally rewrites to /index.html
# — which sets its own Cache-Control — the server-level security headers were
# being silently dropped on every HTML response. Including this file in each
# location that sets its own header keeps them all present.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;

# Tell browsers to stick to HTTPS for a year. Deliberately without
# includeSubDomains, so an unencrypted subdomain later cannot be broken by this.
add_header Strict-Transport-Security "max-age=31536000" always;
